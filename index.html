<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Judith & Roberto</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; background: #efecdd; }
#splash { position: fixed; inset: 0; background: #3a1a0e; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 10; }
#splash p { color: #efecdd; font-family: Georgia, serif; font-size: 20px; letter-spacing: 0.2em; }
video { width: 100%; max-width: 480px; height: 100vh; object-fit: cover; display: block; margin: 0 auto; }
#popup { position: fixed; inset: 0; background: rgba(42,16,8,0.92); display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 20; padding: 32px; }
#popup a { width: 100%; max-width: 380px; display: block; }
#popup img { width: 100%; display: block; }
</style>
</head>
<body>
<div id="splash"><p>▶ &nbsp; Ver Save the Date</p></div>
<video id="vid" playsinline>
<source src="https://res.cloudinary.com/bank0xjn/video/upload/v1786124445/CUT_MOVEBW_SAVE_THE_DATE_v9lbnl.mp4" type="video/mp4">
</video>
<div id="popup">
<a href="https://calendar.google.com/calendar/render?action=TEMPLATE&text=Boda+de+Judith+y+Roberto&dates=20270109/20270110&location=Quito,+Ecuador&sf=true&output=xml" target="_blank">
<img src="botoncalendario.png" alt="Añadir al calendario" />
</a>
</div>
<script>
document.getElementById('splash').addEventListener('click', function() {
var vid = document.getElementById('vid');
vid.muted = false;
vid.play();
this.style.display = 'none';
});
document.getElementById('vid').addEventListener('ended', function() {
document.getElementById('popup').style.display = 'flex';
});
</script>
</body>
</html>
